app-id: com.js8call.JS8Call
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: js8call
rename-desktop-file: js8call.desktop
rename-icon: js8call_icon
finish-args:
  - --device=all
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - shared-modules/linux-audio/fftw3f.json

  - name: hamlib
    sources:
      - type: archive
        url: https://github.com/Hamlib/Hamlib/releases/download/4.7.2/hamlib-4.7.2.tar.gz
        sha256: ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f
        x-checker-data:
          type: anitya
          project-id: 1292
          url-template: https://github.com/Hamlib/Hamlib/releases/download/$version/hamlib-$version.tar.gz

  - name: js8call
    buildsystem: cmake
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    post-install:
      - install -Dm644 com.js8call.JS8Call.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/JS8Call-improved/JS8Call-improved/archive/refs/tags/v2.2.0.tar.gz
        sha256: 7cedd3222c211ef0dcb29fb2b88cab2fd43278256e4b605d7737855107be9dfe
      - type: patch
        path: js8call_cmake.patch
      - type: file
        path: com.js8call.JS8Call.metainfo.xml
